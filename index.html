<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIKAPEL - Kartu Pelajar Digital</title>
    <!-- Favicon / Ikon Tab Browser (Logo SIKAPEL/Tut Wuri Handayani) -->
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/9/9d/Logo_Tut_Wuri_Handayani.png" type="image/png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
            font-family: sans-serif;
        }
        
        /* Styling untuk Iframe */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Tampilan Loading sementara (sebelum iframe termuat sepenuhnya) */
        .loading-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: -1;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #1a237e; /* Warna Navy SIKAPEL */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <!-- Animasi Loading -->
    <div class="loading-screen">
        <div class="spinner"></div>
        <div style="color: #64748b; font-size: 14px;">Memuat SIKAPEL...</div>
    </div>

    <!-- Iframe yang URL-nya diset melalui JavaScript agar mendukung parameter Validasi -->
    <iframe id="sikapelFrame" title="SIKAPEL App" allow="camera; microphone; fullscreen; geolocation"></iframe>

    <script>
        // URL Web App SIKAPEL
        var gasUrl = "https://script.google.com/macros/s/AKfycbwjI_pFW3IPDxcaVvJAB838x2_309AUCdVqVW4R3E8ItVl5an05MXX2CPhmh_WJEi_f/exec";
        
        // Ambil parameter (misal: ?page=validasi&nisn=...)
        var params = window.location.search;
        
        // Trik authuser=0 untuk meminimalisir error multi-akun
        if (params) {
            gasUrl += params + "&authuser=0";
        } else {
            gasUrl += "?authuser=0";
        }
        
        document.getElementById('sikapelFrame').src = gasUrl;
    </script>
</body>
</html>
